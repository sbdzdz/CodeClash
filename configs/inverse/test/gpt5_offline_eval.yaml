# GPT-5 Offline Evaluation - Full test
#
# Offline Evaluation Design:
# - Target vs Opponent play in simulation (learner does NOT play)
# - Learner's code is evaluated offline on target's states
# - Accuracy = "Would learner do the same as target given target's state?"

tournament:
  rounds: 3

game:
  name: BattleSnake
  sims_per_round: 10
  args:
    width: 11
    height: 11
    browser: false

players:
  # Learner: edits code, does NOT play in simulation
  - agent: inverse
    name: learner
    editable: true
    config:
      agent: !include inverse/mini/default.yaml
      model:
        model_name: openai/gpt-5
        cost_tracking: ignore_errors
        model_kwargs:
          api_base: http://localhost:8000/v1
          api_key: dummy

  # Target: strategy to be recovered, plays in simulation
  - agent: static
    name: target
    editable: false
    args:
      source_path: data/inverse/targets/greedy_food

  # Opponent: plays against target in simulation (same as target = self-play)
  - agent: static
    name: opponent
    editable: false
    args:
      source_path: data/inverse/targets/greedy_food

prompts:
  game_description: |
    You are a programmer ({{player_id}}) learning to recover another agent's BattleSnake strategy.
    
    ## Your Goal
    Write code that produces the SAME actions as the target agent.
    This is NOT about winning - it's about matching the target's behavior exactly.
    
    ## The Game: BattleSnake
    BattleSnake is a multiplayer snake game on an 11x11 grid.
    - Your snake moves every turn: "up", "down", "left", or "right"
    - Eat food to grow longer and gain health
    - Avoid walls, your own body, and other snakes
    - If you collide or run out of health, you die
    
    ## How Evaluation Works (IMPORTANT)
    - You do NOT play in the live game
    - The target plays against an opponent to generate traces
    - Your code is evaluated OFFLINE: for each state the target saw, 
      we ask "what would your code do?" and compare to target's action
    - Accuracy = how often your code matches target's decisions
    
    ## What You Need to Do
    1. Read traces from previous rounds to see how the target agent behaves
    2. Identify patterns in the target's decision-making (from target's perspective!)
    3. Edit main.py to replicate those patterns
    4. Your accuracy is measured by: learner_code(target_state) == target_action
    
    ## Key Files
    - `main.py` - Your code (edit this to match target behavior)
    - `docs/` - Game documentation and API reference
    - `/logs/rounds/{N}/traces.json` - Your accuracy and ALL mismatches with full state
    - `/logs/rounds/{N}/sim_*.jsonl` - Raw game traces (target's states and actions)
    
    ## Tips
    - The traces show what TARGET saw and did (not you!)
    - Focus on target's state → target's action mapping
    - mismatches show: "given this state, you said X but target said Y"
    - The target likely follows simple rules (chase food, avoid walls, prefer certain directions)
